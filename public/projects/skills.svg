<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A tester working at a computer while automated tests run in a browser" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run{animation:run 6s infinite;animation-delay:calc(var(--i)*1.4s)}
.chk{opacity:0;animation:chk 6s infinite;animation-delay:calc(var(--i)*1.4s)}
@keyframes chk{0%,12%{opacity:0}18%,80%{opacity:1}90%,100%{opacity:0}}
@keyframes run{0%,12%{opacity:1}18%,80%{opacity:0}90%,100%{opacity:1}}
.hand{animation:tap .45s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(-2.5px)}}
.arm{transform-origin:160px 290px;animation:arm .9s ease-in-out infinite}
@keyframes arm{50%{transform:rotate(-1.6deg)}}
.head{transform-origin:138px 205px;animation:nod 3.2s ease-in-out infinite}
@keyframes nod{50%{transform:translateY(1.5px) rotate(1deg)}}
.insp{animation:insp 6s ease-in-out infinite}
@keyframes insp{0%,30%{transform:translateY(0)}38%,62%{transform:translateY(24px)}72%,90%{transform:translateY(52px)}100%{transform:translateY(0)}}
.cur{animation:cur 6s ease-in-out infinite}
@keyframes cur{0%{transform:translate(520px,236px)}18%,38%{transform:translate(478px,146px)}50%,68%{transform:translate(478px,170px)}80%,88%{transform:translate(436px,198px)}100%{transform:translate(520px,236px)}}
.ty1{transform-box:fill-box;transform-origin:0 50%;animation:ty1 6s steps(10) infinite}
@keyframes ty1{0%,18%{transform:scaleX(0)}38%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.ty2{animation:ty2 6s infinite}
@keyframes ty2{0%,50%{opacity:0}68%,92%{opacity:1}100%{opacity:0}}
.btn{animation:btn 6s infinite}
@keyframes btn{0%,80%{fill:#2c2c2c}84%{fill:#f5c542}94%,100%{fill:#2c2c2c}}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 6s linear infinite}
@keyframes bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.pt{animation:rise 4s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-38px);opacity:0}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.16}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
<defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f5c542"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></radialGradient></defs>

<!-- glow + floor -->
<ellipse class="glow" cx="410" cy="170" rx="230" ry="150" fill="url(#g)" opacity=".1"/>
<ellipse cx="320" cy="402" rx="270" ry="8" fill="#fff" opacity=".06"/>

<!-- desk -->
<rect x="40" y="310" width="570" height="9" rx="4" fill="#8f8f8f"/>
<rect x="584" y="319" width="10" height="81" rx="3" fill="#6e6e6e"/>
<rect x="250" y="319" width="8" height="81" rx="3" fill="#6e6e6e"/>

<!-- monitor -->
<rect x="400" y="268" width="20" height="36" fill="#7a7a7a"/>
<rect x="365" y="302" width="90" height="8" rx="4" fill="#8f8f8f"/>
<rect x="250" y="70" width="320" height="200" rx="10" fill="#101010" stroke="#cfcfcf" stroke-width="3"/>
<rect x="260" y="80" width="300" height="180" rx="5" fill="#161616"/>
<!-- browser chrome -->
<circle cx="272" cy="90" r="3" fill="#7a7a7a"/><circle cx="282" cy="90" r="3" fill="#7a7a7a"/><circle cx="292" cy="90" r="3" fill="#f5c542"/>
<rect x="306" y="84" width="236" height="12" rx="6" fill="#262626"/>
<rect x="314" y="88" width="60" height="4" rx="2" fill="#6b6b6b"/>
<line x1="372" y1="104" x2="372" y2="242" stroke="#2e2e2e"/>

<!-- test rows -->
<g style="--i:0"><circle cx="280" cy="114" r="7" fill="none" stroke="#5f5f5f" stroke-width="1.5"/><g class="run"><circle class="spin" cx="280" cy="114" r="7" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="10 34"/></g><g class="chk"><circle cx="280" cy="114" r="7" fill="#f5c542"/><path d="M276.5 114.2l2.6 2.6 4.4-5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="294" y="110" width="58" height="5" rx="2.5" fill="#9a9a9a"/><rect x="294" y="119" width="36" height="3" rx="1.5" fill="#4a4a4a"/></g>
<g transform="translate(0,24)" style="--i:1"><circle cx="280" cy="114" r="7" fill="none" stroke="#5f5f5f" stroke-width="1.5"/><g class="run"><circle class="spin" cx="280" cy="114" r="7" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="10 34"/></g><g class="chk"><circle cx="280" cy="114" r="7" fill="#f5c542"/><path d="M276.5 114.2l2.6 2.6 4.4-5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="294" y="110" width="46" height="5" rx="2.5" fill="#9a9a9a"/><rect x="294" y="119" width="52" height="3" rx="1.5" fill="#4a4a4a"/></g>
<g transform="translate(0,48)" style="--i:2"><circle cx="280" cy="114" r="7" fill="none" stroke="#5f5f5f" stroke-width="1.5"/><g class="run"><circle class="spin" cx="280" cy="114" r="7" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="10 34"/></g><g class="chk"><circle cx="280" cy="114" r="7" fill="#f5c542"/><path d="M276.5 114.2l2.6 2.6 4.4-5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="294" y="110" width="60" height="5" rx="2.5" fill="#9a9a9a"/><rect x="294" y="119" width="30" height="3" rx="1.5" fill="#4a4a4a"/></g>
<g transform="translate(0,72)" style="--i:3"><circle cx="280" cy="114" r="7" fill="none" stroke="#5f5f5f" stroke-width="1.5"/><g class="run"><circle class="spin" cx="280" cy="114" r="7" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="10 34"/></g><g class="chk"><circle cx="280" cy="114" r="7" fill="#f5c542"/><path d="M276.5 114.2l2.6 2.6 4.4-5" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="294" y="110" width="50" height="5" rx="2.5" fill="#9a9a9a"/><rect x="294" y="119" width="42" height="3" rx="1.5" fill="#4a4a4a"/></g>

<!-- page under test -->
<rect x="390" y="112" width="70" height="7" rx="3" fill="#bdbdbd"/>
<rect x="390" y="138" width="152" height="16" rx="4" fill="#222" stroke="#444"/>
<rect class="ty1" x="396" y="144" width="90" height="4" rx="2" fill="#e5e5e5"/>
<rect x="390" y="162" width="152" height="16" rx="4" fill="#222" stroke="#444"/>
<g class="ty2" fill="#e5e5e5"><circle cx="400" cy="170" r="2"/><circle cx="408" cy="170" r="2"/><circle cx="416" cy="170" r="2"/><circle cx="424" cy="170" r="2"/><circle cx="432" cy="170" r="2"/></g>
<rect class="btn" x="390" y="190" width="62" height="18" rx="5" fill="#2c2c2c" stroke="#555"/>
<rect x="404" y="197" width="34" height="4" rx="2" fill="#bdbdbd"/>
<rect x="390" y="218" width="100" height="4" rx="2" fill="#3a3a3a"/>
<rect class="insp" x="387" y="135" width="158" height="22" rx="5" fill="none" stroke="#f5c542" stroke-width="1.5" stroke-dasharray="5 4"/>
<g class="cur"><path d="M0 0v15l4-3.5 3 6.5 2.4-1.1-3-6.4h5.4z" fill="#fff" stroke="#111" stroke-width="1"/></g>
<!-- progress -->
<rect x="268" y="248" width="284" height="4" rx="2" fill="#2a2a2a"/>
<rect class="bar" x="268" y="248" width="284" height="4" rx="2" fill="#f5c542"/>

<!-- gear + particles -->
<g transform="translate(598,98)"><g class="gear"><circle r="12" fill="none" stroke="#bdbdbd" stroke-width="5" stroke-dasharray="4.7 4.7"/><circle r="9" fill="none" stroke="#f5c542" stroke-width="2"/></g></g>
<circle class="pt" cx="590" cy="190" r="2.5" fill="#f5c542"/>
<circle class="pt" cx="604" cy="170" r="2" fill="#fff" style="animation-delay:1.3s"/>
<circle class="pt" cx="582" cy="150" r="2" fill="#f5c542" style="animation-delay:2.6s"/>

<!-- person glow -->
<ellipse cx="140" cy="280" rx="125" ry="155" fill="url(#g)" opacity=".18"/>

<!-- chair -->
<path d="M82 352C70 320 66 280 74 246" fill="none" stroke="#bdbdbd" stroke-width="9" stroke-linecap="round"/>
<rect x="76" y="345" width="88" height="11" rx="5" fill="#3a3a3a" stroke="#d0d0d0" stroke-width="2"/>
<rect x="116" y="356" width="6" height="30" fill="#bdbdbd"/>
<path d="M82 392h76" stroke="#bdbdbd" stroke-width="5" stroke-linecap="round"/>
<circle cx="84" cy="397" r="4" fill="#d0d0d0"/><circle cx="156" cy="397" r="4" fill="#d0d0d0"/>

<!-- person: outlined style, white rim + dark fill + yellow accents -->
<path d="M108 346L196 340" stroke="#f2f2f2" stroke-width="27" stroke-linecap="round"/>
<path d="M108 346L196 340" stroke="#262626" stroke-width="22" stroke-linecap="round"/>
