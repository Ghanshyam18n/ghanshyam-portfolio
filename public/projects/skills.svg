<path d="M104 346L122 240" stroke="#262626" stroke-width="50" stroke-linecap="round"/>
<path d="M114 300l16-3M110 268l24-4" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/>
<g class="head">
  <rect x="127" y="212" width="22" height="18" rx="6" fill="#cfcfcf"/>
  <circle cx="140" cy="196" r="24" fill="#ececec"/>
  <path d="M163 196l6 8-6 2z" fill="#ececec"/>
  <path d="M116 194C112 164 148 156 164 176c2 6-1 8-4 6-8-10-24-10-32 2-2 4-2 8-2 12z" fill="#2a2a2a" stroke="#f2f2f2" stroke-width="2" stroke-linejoin="round"/>
  <path d="M119 202c2 24 33 28 45 6-4 8-16 9-24 4-8 3-16-1-21-10z" fill="#4a4a4a"/>
  <path d="M120 192C120 164 156 162 161 188" fill="none" stroke="#f5c542" stroke-width="4" stroke-linecap="round"/>
