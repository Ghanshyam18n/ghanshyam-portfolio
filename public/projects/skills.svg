  <path d="M125 250L160 290" stroke="#333" stroke-width="18" stroke-linecap="round"/>
  <path d="M160 290L212 304" stroke="#f2f2f2" stroke-width="20" stroke-linecap="round"/>
  <path d="M160 290L212 304" stroke="#3c3c3c" stroke-width="15" stroke-linecap="round"/>
  <g class="hand"><circle cx="216" cy="304" r="8.5" fill="#ececec"/></g>
</g>

<!-- keyboard -->
